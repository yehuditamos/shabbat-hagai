function render(){let w=$('who').value,future=A.filter(isCurrentOrFuture),es=w=='הכול'?future:future.filter(e=>e.pickup==w||e.dropoff==w);$('ttl').textContent=(w=='הכול'?'כל השיבוצים':'השיבוצים של '+w)+' · '+es.length;$('events').innerHTML=es.map(e=>`<div class="event ${e.holiday?'holiday':''}"><div><b>${fmt(e.start)}</b><div class="muted">עד ${fmt(e.end)}</div></div><div><b>${e.title}</b><div>🏠 ${e.pickup}${e.ps?' <span class="sw">הוחלף</span>':''} &nbsp; 🚗 ${e.dropoff}${e.ds?' <span class="sw">הוחלף</span>':''}</div></div><button class="cal" data-id="${e.id}">📅 ליומן</button></div>`).join('');document.querySelectorAll('.cal').forEach(b=>b.onclick=()=>openCal([A.find(e=>e.id==b.dataset.id)]));$('allcal').onclick=()=>openCal(es)}function dash(){$('dashList').innerHTML=A.map(e=>`<div class="dash" data-id="${e.id}"><b>${e.title} · ${fmt(e.start)}</b><div class="muted">מקורי: 🏠 ${e.op} · 🚗 ${e.od}</div>${['pickup','dropoff'].map((r,i)=>{let o=O[e.id]||{},on=o[r+'_swapped'],v=o[r+'_replacement']||R.find(x=>x!=(i?e.od:e.op));return `<div class="row"><b>${i?'🚗 החזרה':'🏠 לקיחה'}</b><label><input class="chk" data-r="${r}" type="checkbox" ${on?'checked':''}> בוצעה החלפה</label><select data-r="${r}" ${on?'':'disabled'}>${R.filter(x=>x!=(i?e.od:e.op)).map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select></div>`}).join('')}</div>`).join('');document.querySelectorAll('.dash').forEach(c=>{c.querySelectorAll('.chk').forEach(ch=>ch.onchange=()=>{let s=c.querySelector(`select[data-r="${ch.dataset.r}"]`);s.disabled=!ch.checked;save(c.dataset.id,ch.dataset.r,ch.checked,s.value)});c.querySelectorAll('select').forEach(s=>s.onchange=()=>save(c.dataset.id,s.dataset.r,true,s.value))})}function renderAll(){let n=A.find(e=>e.end>=new Date())||A[A.length-1];$('next').innerHTML=`<div><span class="muted">השבת הקרובה</span><h2>${fmt(n.start)} עד ${fmt(n.end)}</h2></div><div class="roles"><div class="role">🏠 <b>${n.pickup}</b></div><div class="role">🚗 <b>${n.dropoff}</b></div><
